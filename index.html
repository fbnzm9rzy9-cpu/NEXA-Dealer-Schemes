 const loginButton=document.querySelector('#loginForm button[type="submit"]');
 const err=document.getElementById('err');
 try{
  if(!window.XLSX) throw new Error(window.dealerWorkbookScriptFailed?'Spreadsheet reader script failed to load':'Spreadsheet reader did not load');
  const response=await fetch('./All%20Scheme%20Portal%20Data.xlsx?ts='+Date.now(),{cache:'no-store'});

  const val=(row,col)=>{const x=sheet[col+row];return x&&x.v!==undefined?x.v:null};

   const code=s(row,'C').toUpperCase();
   if(!code)continue;
   const d={name:s(row,'B'),code,password:s(row,'D'),

    psl:{grp:s(row,'Z'),rank:s(row,'AA'),sb:n(row,'AB'),sa:n(row,'AC'),sg:n(row,'AD'),pb:n(row,'AE'),pr:n(row,'AF'),pgr:n(row,'AG'),qb:n(row,'AH'),qa:n(row,'AI'),qg:n(row,'AJ'),octbase:n(row,'AK'),octachi:n(row,'AL'),octgrowth:n(row,'AM'),qual:(n(row,'AD')>=0?'Qualified':'Not Qualified')},
    nac:{base:n(row,'AO'),ach:n(row,'AP'),g1:n(row,'AQ'),g2:n(row,'AR'),g3:n(row,'AS'),g4:n(row,'AT'),gvq3:n(row,'AU'),req:n(row,'AV'),gach:n(row,'AW'),ggap:n(row,'AX'),wtgt:n(row,'AY'),wach:n(row,'AZ'),wpct:n(row,'BA'),cur:n(row,'BB'),pot:n(row,'BC'),qual:s(row,'BD','Not Qualified')},
    mega:{tgt:n(row,'BF'),ach:n(row,'BG'),achp:n(row,'BH'),dms:n(row,'BI'),dmsp:n(row,'BJ'),slab:s(row,'BK','No Slab'),gt:n(row,'BL'),ga:n(row,'BM'),gp:n(row,'BN'),it:n(row,'BO'),ia:n(row,'BP'),ip:n(row,'BQ'),xt:n(row,'BR'),xa:n(row,'BS'),xp:n(row,'BT'),jt:n(row,'BU'),ja:n(row,'BV'),jp:n(row,'BW'),cur:n(row,'BX'),pot:n(row,'BY'),qual:s(row,'BZ','Not Qualified')},
    gvsc:{tgt:n(row,'CB'),ach:n(row,'CC'),pct:n(row,'CD'),cur:n(row,'CE'),pot:n(row,'CF'),qual:s(row,'CG','Not Qualified')},
    tdd:{tgt:n(row,'CI'),ach:n(row,'CJ'),pct:n(row,'CK'),wsTgt:n(row,'CL'),wsAch:n(row,'CM'),wsAchi2:n(row,'CN'),sig:n(row,'CO'),dlt:n(row,'CP'),cur:n(row,'CQ'),pot:n(row,'CR'),qual:s(row,'CS','Not Qualified')},
    elevate:{base:n(row,'CU'),retail:n(row,'CV'),growth:n(row,'CW'),hbase:n(row,'CX'),hretail:n(row,'CY'),hgrowth:n(row,'CZ'),incremental:n(row,'DA'),slab:s(row,'DB','No Slab'),cur:n(row,'DC'),pot:n(row,'DD'),qual:s(row,'DE','Not Qualified')},rural:{base:n(row,'DG'),ach:n(row,'DH'),gaps:[n(row,'DI'),n(row,'DJ'),n(row,'DK'),n(row,'DL')],extraBase:n(row,'DN'),extraAch:n(row,'DO'),extraGaps:[n(row,'DP'),n(row,'DQ'),n(row,'DR'),n(row,'DS')],qualBase:n(row,'DT'),qualAch:n(row,'DU'),qualGrowth:n(row,'DV'),cur:n(row,'DW'),pot:n(row,'DX'),qual:s(row,'DY','Not Qualified')},evitara:{tgt:n(row,'EA'),ach:n(row,'EB'),pct:n(row,'EC'),cur:n(row,'ED'),pot:n(row,'EE'),qual:s(row,'EF','Not Qualified')}};
   // Keep the official status wording as supplied by the workbook, while accepting minor spelling variants.

.header-right{position:relative;align-self:stretch;justify-content:flex-start;gap:0}
.header-right .nexa-official-logo{margin-top:0}
.header-right .actions{position:absolute;right:0;bottom:0}

 .header-right .actions{bottom:0}
}

/* Prevent header contents from overlapping: keep logo and Logout in normal flow */
.top{align-items:stretch!important;gap:24px!important}
.dealer-title{flex:1 1 auto;min-width:0}
.dealer-name-line{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.dealer-title .disclaimer{max-width:100%;overflow-wrap:anywhere}
.header-right{position:relative;align-self:stretch;display:flex;flex:0 0 auto;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;min-width:145px;max-width:none}
.header-right .nexa-official-logo{display:block;position:static;margin:0;flex:0 0 auto;max-width:100%;max-height:58px;object-fit:contain}
.header-right .actions{position:static;right:auto;bottom:auto;margin-top:auto;flex:0 0 auto}

@media(max-width:620px){
 .top{align-items:stretch!important;gap:16px!important}
 .header-right{min-width:96px;max-width:108px;gap:12px}

}

 .header-right{min-width:78px;max-width:82px}

}

/* Scheme categories and subtle qualification status colors */
.scheme-category{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
.category-heading{margin:0;padding:10px 14px;border:1px solid rgba(135,169,224,.2);border-left:3px solid #6e9de9;border-radius:10px;background:linear-gradient(110deg,rgba(22,53,101,.42),rgba(255,255,255,.025));color:#dce8fb;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.scheme summary .status.yes{background:rgba(34,197,94,.11);border-color:rgba(74,222,128,.26);color:#a7f3c0}
.scheme summary .status.no{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.24);color:#ffc4c4}
@media(max-width:620px){.category-heading{padding:9px 11px;font-size:11px}.scheme-category{gap:9px;margin-bottom:15px}}

/* Clearer category-specific serial badges */
.scheme-category:first-of-type .scheme:nth-of-type(2) summary .num{background:linear-gradient(145deg,#8a5bda,#55339c)!important;border-color:#c4a8ff!important;color:#fff!important}
.scheme-category:first-of-type .scheme:nth-of-type(3) summary .num{background:linear-gradient(145deg,#0d9470,#075d4b)!important;border-color:#72e0bb!important;color:#fff!important}
.scheme-category:nth-of-type(2) .scheme:nth-of-type(2) summary .num{background:linear-gradient(145deg,#1769e0,#10428f)!important;border-color:#86b8ff!important;color:#fff!important}
.scheme-category:nth-of-type(2) .scheme:nth-of-type(3) summary .num{background:linear-gradient(145deg,#bd7a19,#81500e)!important;border-color:#ffd27b!important;color:#fff!important}
.scheme-category:nth-of-type(2) .scheme:nth-of-type(4) summary .num{background:linear-gradient(145deg,#c23f68,#812644)!important;border-color:#ffabc2!important;color:#fff!important}
.scheme-category:nth-of-type(2) .scheme:nth-of-type(5) summary .num{background:linear-gradient(145deg,#087f91,#075365)!important;border-color:#82e7f0!important;color:#fff!important}
.scheme-category:nth-of-type(2) .scheme:nth-of-type(6) summary .num{background:linear-gradient(145deg,#53657e,#35455d)!important;border-color:#b1c3dc!important;color:#fff!important}
/* Stronger but tasteful qualification colors for quick recognition */
.scheme summary .status.yes{background:rgba(34,197,94,.22)!important;border-color:rgba(74,222,128,.65)!important;color:#86efac!important;box-shadow:inset 0 0 0 1px rgba(74,222,128,.08)}
.scheme summary .status.no{background:rgba(239,68,68,.22)!important;border-color:rgba(248,113,113,.7)!important;color:#fca5a5!important;box-shadow:inset 0 0 0 1px rgba(248,113,113,.08)}

/* Category headers only — keep scheme card colors unchanged */
.scheme-category:first-of-type>.category-heading{
 background:linear-gradient(105deg,#1c2940 0%,#263d5e 100%);
 border:1px solid rgba(143,177,225,.38);
 border-left:4px solid #a7c8ff;
 color:#edf4ff;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.scheme-category:nth-of-type(2)>.category-heading{
 background:linear-gradient(105deg,#17352f 0%,#1e4a43 100%);
 border:1px solid rgba(111,190,163,.32);
 border-left:4px solid #70d4b3;
 color:#e4fff5;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}

/* HO category: switch to a richer plum and champagne accent */
.scheme-category:first-of-type>.category-heading{
 background:linear-gradient(105deg,#39233f 0%,#573553 100%);
 border:1px solid rgba(220,174,214,.34);
 border-left:4px solid #e6bd82;
 color:#fff0dd;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
}
/* Dealer information card now sits after the scheme list */
#app>.top{margin-top:22px}

/* Make every Gap metric orange and negative growth (degrowth) red */
.scheme .metric .v.gap,.scheme .metric .v.gap *{color:#f59e0b!important}
.scheme .metric .v.neg,.scheme .metric .v.neg *{color:#ef4444!important}
.scheme .metric .v.pos,.scheme .metric .v.pos *{color:#16a34a!important}

/* Increase category heading typography for stronger hierarchy */
.scheme-category>.category-heading{font-size:15px;padding:13px 16px;letter-spacing:.09em}
@media(max-width:620px){.scheme-category>.category-heading{font-size:14px;padding:12px 13px}}

.remember-login{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:0 0 12px;cursor:pointer}.remember-login input{accent-color:#1769e0;width:14px;height:14px;margin:0;flex:0 0 auto}
