function login(e){e.preventDefault();const code=document.getElementById("code").value.trim().toUpperCase(),pwd=document.getElementById("pwd").value.trim(),d=DEALERS[code],err=document.getElementById("err");if(!d||d.password!==pwd){err.textContent="Invalid Dealer Code or Password.";err.style.display="block";return}err.style.display="none";document.getElementById("loginPage").style.display="none";document.getElementById("app").style.display="block";document.getElementById("dealerName").textContent=d.name;document.getElementById("dealerCode").textContent=d.code;const arr=[d.vahan,d.pp,d.psl,d.nac,d.mega,d.gvsc,d.tdd];const cur=arr.reduce((s,x)=>s+(typeof x.cur==="number"?x.cur:0),0);const pot=arr.reduce((s,x)=>s+(typeof x.pot==="number"?x.pot:0),0);const ach=typeof d.vahan.ach==="number"&&typeof d.vahan.tgt==="number"&&d.vahan.tgt?d.vahan.ach/d.vahan.tgt:0;document.getElementById("summary").innerHTML='<div class="sum blue"><div class="lab">Current Earnings</div><div class="val">'+fmt(cur,"cur")+'</div></div><div class="sum green"><div class="lab">Earning Potential</div><div class="val">'+fmt(pot,"cur")+'</div></div><div class="sum purple"><div class="lab">Vahan Achievement</div><div class="val">'+fmt(ach,"pct")+'</div><div class="note">'+fmt(d.vahan.ach)+' / '+fmt(d.vahan.tgt)+'</div></div>';document.getElementById("schemes").innerHTML=render(d);document.querySelectorAll("details.scheme").forEach(x=>x.open=false);document.getElementById("toggle").textContent="Expand all";window.scrollTo(0,0)}
document.getElementById("loginForm").addEventListener("submit",login);
document.getElementById("logout").onclick=()=>{document.getElementById("app").style.display="none";document.getElementById("loginPage").style.display="grid";document.getElementById("loginForm").reset();document.getElementById("err").style.display="none"};
document.getElementById("toggle").onclick=()=>{const ds=[...document.querySelectorAll("details.scheme")],open=ds.some(x=>!x.open);ds.forEach(x=>x.open=open);document.getElementById("toggle").textContent=open?"Collapse all":"Expand all"};
</script></body></html>
